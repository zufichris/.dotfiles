source = ~/.config/hypr/hyprlock-colors.conf

$glass      = rgba(255, 255, 255, 0.1)
$glass_edge = rgba(255, 255, 255, 0.15)
$glass_ring = rgba(255, 255, 255, 0.25)

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.cache/current_wallpaper
    color = $surface

    blur_passes = 3
    blur_size = 3
    noise = 0.0
    contrast = 0.89
    brightness = 0.82
}

animations {
    enabled = true
    bezier = fluid, 0.45, 0, 0.55, 1

    animation = fadeIn, 1, 6, fluid
    animation = fadeOut, 1, 6, fluid
    animation = inputFieldDots, 1, 2, linear
    animation = inputFieldColors, 1, 8, fluid
    animation = inputFieldFade, 1, 8, fluid
    animation = inputFieldWidth, 1, 8, fluid
}

image {
    monitor =
    path = ~/.config/hypr/avatar.png
    border_size = 2
    border_color = $glass_ring
    size = 180
    rounding = -1
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $on_surface_dim
    font_size = 17
    font_family = Adwaita Sans Bold
    position = 0, 345
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $primary_dim
    font_size = 96
    font_family = Adwaita Sans Bold
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = $on_surface_dim
    font_size = 15
    font_family = Adwaita Sans Bold
    position = 0, -80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    rounding = 27
    outline_thickness = 1
    outer_color = $glass_edge
    inner_color = $glass
    font_color = $on_surface
    font_family = Adwaita Sans Bold
    check_color = $primary_dim
    fail_color = $error_dim
    capslock_color = $error_dim

    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true

    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -160
    halign = center
    valign = center
}

image {
    monitor =
    path = /dev/null
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/lock-nowplaying.sh --art
    onclick = ~/.config/hypr/scripts/lock-nowplaying.sh --toggle
    border_size = 0
    rounding = 0
    size = 128
    position = 24, 24
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-nowplaying.sh --title
    color = $on_surface
    font_size = 15
    font_family = Adwaita Sans Bold
    position = 152, 86
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-nowplaying.sh --artist
    color = $on_surface_muted
    font_size = 12
    font_family = Adwaita Sans
    position = 152, 60
    halign = left
    valign = bottom
}
